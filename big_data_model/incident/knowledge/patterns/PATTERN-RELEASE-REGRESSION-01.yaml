id: PATTERN-RELEASE-REGRESSION-01
名称: 发布/变更引入回归导致业务异常
版本: 1
状态: 启用
适用条件: 24 小时内发生过版本发布、规则发布或变更操作的系统
症状标签: [errors]
现象: >-
  异常起始时间与某次发布/变更时间点吻合;BPC 成功率下降或错误类日志陡增,
  形态上常为"发布后突变"而非缓慢恶化
候选根因:
  - 新版本代码缺陷或配置错误
  - 规则发布引入的新逻辑/新 SQL 在生产数据规模下行为异常
验证:
  - probe: release_rules_recent
    判定: 存在 12 小时内的规则发布,且发布时长与异常起始时间吻合
    区分: [PATTERN-DB-SATURATION-01]
  - probe: related_changes
    判定: 24 小时内存在关联变更/升级单,且变更对象与受影响系统一致
    区分: []
  - probe: bpc_system_metrics
    判定: 异常起始时间不早于发布/变更时间(早于则本模式不成立)
    区分: []
排除: 异常起始明显早于一切发布/变更时间点时,本模式不成立
来源案例: []
备注: 可与 PATTERN-DB-SATURATION-01 同时成立(发布引入慢 SQL → DB 饱和),此时互为根因链上下游
